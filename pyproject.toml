[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inspectcoder-cj"
version = "0.2.0"
description = "Evidence-grounded Cangjie program repair with persistent native CJDB"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "mtghorbani"}]
keywords = ["cangjie", "debugger", "program-repair", "opencode", "pi", "vscode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/mtghorbani/inspectcoder-cj"
Repository = "https://github.com/mtghorbani/inspectcoder-cj"
Issues = "https://github.com/mtghorbani/inspectcoder-cj/issues"
Documentation = "https://github.com/mtghorbani/inspectcoder-cj#readme"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "twine>=6,<7"]

[project.scripts]
inspect-cj = "inspect_cj.cli:main"
inspectcoder-cj = "inspect_cj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["native: executes installed native Cangjie compiler and CJDB"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
